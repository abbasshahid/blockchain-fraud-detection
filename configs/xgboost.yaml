model: xgboost
processed_path: data/processed/elliptic_temporal_v1_all_original_features.pt
output_dir: outputs
experiment_name: elliptic_temporal_v1
feature_mode: all_original_features
params:
  objective: binary:logistic
  eval_metric: aucpr
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  reg_lambda: 1.0
  reg_alpha: 0.0
  early_stopping_rounds: 50

